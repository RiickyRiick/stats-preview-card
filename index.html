<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Stats preview card component</title>

</head>

<body>

  <main class="main-container">
    <article class="business-card">

      <div class="card-text">
        <h1 class="card-title">Get <span class="insights">insights</span> that help your business grow.</h1>
        <p class="card-subtitle"> Discover the benefits of data analytics and make better decisions
          regarding revenue, customer experience, and overall efficiency.</p>

        <div class="business-stats">

          <section>
            <p class="numbers">10k+</p>
            <p class="categories">companies</p>
          </section>

          <section>
            <p class="numbers">314</p>
            <p class="categories">templates</p>
          </section>

          <section>
            <p class="numbers">12M+</p>
            <p class="categories">queries</p>
          </section>
        </div>
      </div>

      <div class="img-wrapper">
        <img src="./images/image-header-desktop.jpg" alt="image-header">
      </div>
    </article>
    <footer>
      <p class="attribution">
        Challenge by 
        <img src="./images/favicon-32x32.png" alt="icon">
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
        Coded by <a href="https://www.frontendmentor.io/profile/RiickyRiick" target="_blank">Rodrigo Arroyo-Haro</a>.
      </p>
    </footer>
  
  </main>
 
</body>

</html>
